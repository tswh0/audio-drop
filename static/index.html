<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>audio-drop</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/oat.min.css">
<link rel="stylesheet" href="/page.css">
</head>
<body>

<article class="card">
  <header>
    <h1>audio-drop</h1>
    <p data-i18n="subtitle">YouTube-Link einfügen, Format wählen, fertige Audiodatei herunterladen.</p>
  </header>

  <form id="convert">
    <div class="vstack gap-4">
      <label data-field><span data-i18n="link">YouTube-Link</span>
        <div class="input-row">
          <input type="url" name="url" placeholder="https://www.youtube.com/watch?v=..." required autocomplete="off" spellcheck="false">
          <button type="button" class="outline small paste" data-i18n="paste">Einfügen</button>
        </div>
      </label>
      <label data-field><span data-i18n="format">Format</span>
        <select name="format">
          <option value="mp3" selected>MP3</option>
          <option value="m4a">M4A (AAC)</option>
          <option value="opus">Opus</option>
          <option value="original" data-i18n="format_original">Original (keine Neukodierung)</option>
        </select>
      </label>
      <label data-field class="quality-field" hidden><span data-i18n="quality">Qualität</span>
        <select name="quality"></select>
      </label>
      <button id="convert-button" data-i18n="convert">Konvertieren</button>
    </div>
  </form>

  <div class="progress" hidden>
    <div class="bar" role="progressbar" aria-label="Konvertierungsfortschritt" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i></i></div>
    <p class="phase"><span class="phase-label">Wird gestartet …</span><span class="phase-value">0%</span></p>
  </div>
  <p class="notice" hidden></p>

  <form id="meta" class="meta" hidden>
    <div class="vstack gap-4">
      <label data-field><span data-i18n="meta_title">Titel</span>
        <input type="text" name="title" maxlength="200" required autocomplete="off">
      </label>
      <label data-field><span data-i18n="meta_artist">Künstler</span>
        <input type="text" name="artist" maxlength="200" required autocomplete="off">
      </label>
      <label data-field><span data-i18n="meta_album">Album</span>
        <input type="text" name="album" maxlength="200" autocomplete="off">
      </label>
      <button data-i18n="download">Herunterladen</button>
    </div>
  </form>
</article>

<script src="/oat.min.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
