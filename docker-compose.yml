services:
  audio-drop:
    build: .
    image: audio-drop:latest
    container_name: audio-drop
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      MAX_DURATION: "10800"
      MAX_CONCURRENT: "2"
      MAX_JOBS: "20"
    tmpfs:
      - /tmp:size=2g,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
