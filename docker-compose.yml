services:
  audio-drop:
    image: ghcr.io/tswh0/audio-drop:latest
    pull_policy: always
    container_name: audio-drop
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      MAX_DURATION: "10800"
      MAX_CONCURRENT: "2"
      MAX_JOBS: "20"
      LANGUAGE: "${LANGUAGE:-en}"
      EXPERT_MODE: "${EXPERT_MODE:-false}"
      TRUSTED_PROXY: "192.168.6.134"
    init: true
    cpus: "2"
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 128
    tmpfs:
      - /tmp:size=2g,mode=1777
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
